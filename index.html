<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex,nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>にじさんじボイス感想まとめ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>ボイス感想</h1>
  </header>

  <main class="container">
    <!-- 絞り込みフィルターエリア -->
    <section class="filter-section">
      <div class="filter-group">
        <label>ライバー名：</label>
        <input type="text" id="search-liver" placeholder="ライバー名を入力...">
      </div>

      <div class="filter-group">
        <label>ジャンル：</label>
        <input type="text" id="search-tag" placeholder="ジャンルを入力...">
      </div>

      <!-- ★追加：タグ選択プルダウン -->
      <div class="filter-group">
        <label>タグ一覧：</label>
        <select id="select-tag">
          <option value="">すべてのタグ</option>
        </select>
      </div>

      <div class="filter-group">
        <label>販売状況：</label>
        <select id="filter-status">
          <option value="all">すべて</option>
          <option value="常設販売中">販売中</option>
          <option value="期間終了">販売終了</option>
        </select>
      </div>

      <!-- ★追加：選択中タグのバッジ表示エリア -->
      <div id="active-tag-badge" class="active-tag-container" style="display: none;">
        <span>選択中のタグ：</span>
        <span class="active-badge" onclick="clearTagFilter()">
          <span id="active-tag-name"></span> ✖
        </span>
      </div>
    </section>

    <!-- ボイスカード一覧エリア -->
    <div id="card-list" class="card-grid"></div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
